services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devmonitor_web
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql+pymysql://devmonitor_app:devmonitor_pass@db:3306/devmonitor?charset=utf8mb4
      - SECRET_KEY=production-secure-random-token-change-in-prod
      - FLASK_ENV=production
      - COOKIE_SECURE=false
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devmonitor_net
    expose:
      - "5000"

  db:
    image: mysql:8.0
    container_name: devmonitor_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: devmonitor
      MYSQL_USER: devmonitor_app
      MYSQL_PASSWORD: devmonitor_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "devmonitor_app", "-pdevmonitor_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devmonitor_net

  nginx:
    image: nginx:alpine
    container_name: devmonitor_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - web
    networks:
      - devmonitor_net

volumes:
  mysql_data:

networks:
  devmonitor_net:
    driver: bridge
