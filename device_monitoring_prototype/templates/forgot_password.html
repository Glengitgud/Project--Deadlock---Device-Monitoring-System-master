<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - DevMonitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon"><i class="bi bi-key-fill"></i></div>
                <h3>Recover Password</h3>
                <p>Enter your username or email address to receive recovery instructions</p>
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
                {% endfor %}
            {% endwith %}
            <form method="post" action="{{ url_for('forgot_password') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="identity" class="form-label">Username or Email</label>
                    <input type="text" class="form-control" id="identity" name="identity"
                           placeholder="Enter your username or email" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary w-100 login-btn">
                    <i class="bi bi-send-fill me-1"></i>Send Recovery Link
                </button>
            </form>
            <p class="text-center mt-4 mb-0">
                <a href="{{ url_for('login') }}" class="text-muted small">Return to Sign In</a>
            </p>
        </div>
    </div>
</body>
</html>
