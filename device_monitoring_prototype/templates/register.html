<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Device Monitoring System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon"><i class="bi bi-pc-display-horizontal"></i></div>
                <h3>Create your account</h3>
                <p>Register to manage your devices with DevMonitor</p>
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
                {% endfor %}
            {% endwith %}
            <form method="post" action="{{ url_for('register') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input id="full_name" name="full_name" class="form-control" required
                           maxlength="120" autocomplete="name"
                           value="{{ request.form.get('full_name', '') }}">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input id="email" name="email" type="email" class="form-control" required
                           maxlength="254" autocomplete="email"
                           value="{{ request.form.get('email', '') }}">
                </div>
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" name="username" class="form-control" required
                           minlength="3" maxlength="64" pattern="[A-Za-z0-9_.-]+"
                           autocomplete="username"
                           value="{{ request.form.get('username', '') }}">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" name="password" type="password" class="form-control"
                           required minlength="12" maxlength="1024" autocomplete="new-password">
                    <div class="form-text">Use at least 12 characters.</div>
                </div>
                <button type="submit" class="btn btn-primary w-100 login-btn">
                    <i class="bi bi-person-plus me-1"></i>Create Account
                </button>
            </form>
            <p class="text-center mt-4 mb-0">
                <span class="text-muted">Already registered?</span>
                <a href="{{ url_for('login') }}">Sign in</a>
            </p>
        </div>
    </div>
</body>
</html>
