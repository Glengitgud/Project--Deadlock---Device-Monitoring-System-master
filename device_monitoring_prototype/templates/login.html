<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Device Monitoring System</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <!-- Custom Stylesheet -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-card">
            <!-- System Logo and Title -->
            <div class="login-header">
                <div class="login-icon">
                    <i class="bi bi-pc-display-horizontal"></i>
                </div>
                <h3>DevMonitor</h3>
                <p>Centralized End-User Device Monitoring &amp; Diagnostic System</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" method="post" action="{{ url_for('login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
                <!-- Username Field -->
                <div class="mb-3">
                    <label for="username" class="form-label">
                        <i class="bi bi-person me-1"></i>Username
                    </label>
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="Enter your username" required autocomplete="username"
                           maxlength="64" value="{{ request.form.get('username', '') }}">
                </div>

                <!-- Password Field -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="passwordInput" class="form-label mb-0">
                            <i class="bi bi-lock me-1"></i>Password
                        </label>
                        <a href="{{ url_for('forgot_password') }}" class="small text-muted text-decoration-none">Forgot password?</a>
                    </div>
                    <div class="input-group">
                        <input type="password" class="form-control" id="passwordInput"
                               name="password" placeholder="Enter your password" required
                               autocomplete="current-password">
                        <button class="btn btn-outline-secondary" type="button"
                                id="togglePassword" title="Show/Hide password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                    <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
                    {% endfor %}
                {% endwith %}

                <!-- Login Button -->
                <button type="submit" class="btn btn-primary w-100 login-btn" id="loginBtn">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
                </button>
            </form>
            <p class="text-center mt-4 mb-0">
                <span class="text-muted">New to DevMonitor?</span>
                <a href="{{ url_for('register') }}">Create an account</a>
            </p>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
