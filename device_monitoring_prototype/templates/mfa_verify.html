<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Authentication - DevMonitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon"><i class="bi bi-shield-check"></i></div>
                <h3>Two-Factor Verification</h3>
                <p>Enter the 6-digit code from your authenticator app</p>
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
                {% endfor %}
            {% endwith %}
            <form method="post" action="{{ url_for('mfa_verify') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-4">
                    <label for="totp_code" class="form-label text-center d-block">Authentication Code</label>
                    <input type="text" class="form-control form-control-lg text-center fw-bold"
                           id="totp_code" name="totp_code" placeholder="000000"
                           maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" autofocus required
                           style="letter-spacing: 0.35em; font-size: 1.5rem;">
                </div>
                <button type="submit" class="btn btn-primary w-100 login-btn">
                    <i class="bi bi-unlock-fill me-1"></i>Verify &amp; Sign In
                </button>
            </form>
            <p class="text-center mt-4 mb-0">
                <a href="{{ url_for('login') }}" class="text-muted small">Back to Sign In</a>
            </p>
        </div>
    </div>
</body>
</html>
